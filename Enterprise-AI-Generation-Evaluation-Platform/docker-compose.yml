services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-generation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aigen
      POSTGRES_USER: aigen
      POSTGRES_PASSWORD: aigenpassword
    ports:
      - "5436:5432"
    volumes:
      - aigen_postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: ai-generation-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    container_name: ai-generation-grafana
    restart: unless-stopped
    ports:
      - "3002:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  aigen_postgres_data:
  grafana_data:
